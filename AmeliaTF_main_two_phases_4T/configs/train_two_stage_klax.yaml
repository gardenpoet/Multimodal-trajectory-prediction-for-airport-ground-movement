# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other

defaults:
  - _self_
  - data: klax.yaml
  - model: combined_traj_pred.yaml
  - callbacks: default.yaml
  - logger: wandb.yaml
  - trainer: gpu.yaml
  - paths: default.yaml
  - extras: default.yaml
  - hydra: default.yaml

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default.yaml

  # debugging config (enable through command line, e.g. `python train.py debug=default)
  - debug: null

ckpt_dir: ${paths.base_dir}/checkpoints
type: Single-Airport
ckpt: klax2
mode_ckpt_path: ${ckpt_dir}/${type}/${ckpt}/mode_model/${ckpt}_twophases_50.ckpt
traj_ckpt_path: ${ckpt_dir}/${type}/${ckpt}/traj_model/${ckpt}_twophases_4_50.ckpt

scratch_joint: False
e2e_finetune: False
e2e_epochs: 10

# task name, determines output directory path
task_name: "train"

# tags to help you identify your experiments
tags: ["two_stage", "mode", "trajectory", "teacher_forcing"]

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training
test: True

# compile model for faster training with pytorch 2.0
compile: False

# simply provide checkpoint path to resume training
ckpt_path: null

# seed for random number generators in pytorch, numpy and python.random
seed: 42

mode_epochs: 40

traj_epochs: 100
# early stopping patience
patience: 20

run_end_to_end_test: True

save_model_paths: True

# Checkpoint-reuse workflow: mode classification does not depend on
# num_futures, so set skip_mode_training=True (with mode_ckpt_path pointing at
# an already-trained checkpoint, e.g. from a train_mode_* SLURM job) to skip
# Stage 1 and go straight to the num_futures sweep in Stage 2.
skip_mode_training: False
# set True for a dedicated "train mode once" job: trains Stage 1 only, saves
# it to mode_ckpt_path, then exits before Stage 2/3.
skip_traj_training: False

mode:
  epochs: ${mode_epochs}
  patience: ${patience}

trajectory:
  epochs: ${traj_epochs}
  patience: ${patience}

# Two-phases (non "-W") grid: no mode-frequency loss weighting in either
# stage. See amelia_tf/data/datamodule.py (use_mode_weights gate) and
# amelia_tf/models/traj_pred_combined.py (both ModePredictionModel and
# TrajectoryPredictionModel consume the same dm.mode_weights tensor).
data:
  extra_params:
    data_prep:
      use_mode_weights: false