type: Single-Airport
ckpt: kmsy2

defaults:
  - _self_
  - data: kmsy.yaml
  - model: combined_traj_pred.yaml
  - callbacks: default.yaml
  - logger: wandb.yaml # set logger here or use command line (e.g. `python train.py logger=tensorboard`)
  - trainer: default.yaml
  - paths: default3.yaml
  - extras: default.yaml
  - hydra: default.yaml

task_name: "eval"

tags: ["two_phases"]

# passing checkpoint path is necessary for evaluation

ckpt_dir: ${paths.base_dir}/checkpoints
mode_ckpt_path: ${ckpt_dir}/${type}/${ckpt}/mode_model/${ckpt}_twophases_50.ckpt
traj_ckpt_path: ${ckpt_dir}/${type}/${ckpt}/traj_model/${ckpt}_twophases_50.ckpt
# seed for random number generators in pytorch, numpy and python.random
seed: 42

scorer:
  stage: eval          # eval | score
  lr: 1.0e-3
  weight_decay: 1.0e-4
  score_head_save: /gpfs/scratch/exy064/ljx/Risk-Assessment/AmeliaTF_main_two_phases/out/per_mode_scorer.pt
