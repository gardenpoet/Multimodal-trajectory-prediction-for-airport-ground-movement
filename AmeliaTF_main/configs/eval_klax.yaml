# @package _global_

# Test-only config: loads an already-trained checkpoint and runs trainer.test()
# without any training, via amelia_tf/eval.py. Same data/model/paths composition
# as train_klax.yaml (as actually configured on the HPC: data=klax.yaml,
# paths=default.yaml -- NOT the "2"-suffixed pair, which is a different,
# H20-horizon data config in this repo; this local clone's train_klax.yaml
# is stale/out of sync with the HPC on this point) so the test set matches
# exactly what klax_baseline_50 was trained/tested on.

defaults:
  - _self_
  - data: klax.yaml
  - model: marginal.yaml
  - logger: wandb.yaml
  - trainer: gpu.yaml
  - paths: default.yaml
  - extras: default.yaml
  - hydra: default.yaml

task_name: "eval"
tags: ["dev"]

# data/klax.yaml -> default.yaml interpolates ${seed} into dataset.config.seed;
# eval.py (unlike train_klax.py) has no top-level seed default of its own.
seed: 42

# Best-val-metric checkpoint (epoch_062.ckpt, save_top_k=1 on val/ade/t=max)
# from the already-completed klax_baseline_50 training run (job stuck at 92%
# test progress, but training itself finished and saved checkpoints under
# ${paths.log_dir}/train/runs/2026-09-18_16-13-14/checkpoints/) -- NOT
# last.ckpt, which is a later, non-best epoch (mtime ~19h after epoch_062.ckpt,
# so training kept running past epoch 62 without ever beating its validation
# score). Copied into datasets/amelia/checkpoints/Single-Airport/klax/ (a
# consolidated, airport-named location alongside the two-stage model's
# klax2/klax_20 checkpoints) rather than left under the run-timestamped path.
ckpt_path: /gpfs/scratch/exy064/ljx/Risk-Assessment/AmeliaTF_main/datasets/amelia/checkpoints/Single-Airport/klax/klax_baseline_50.ckpt
